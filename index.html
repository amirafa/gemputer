<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>GemPuter</title>
        
        <!-- Puter.js SDK -->
        <script src="https://js.puter.com/v2/"></script>
        <script>
            if (typeof puter !== "undefined") {
                puter.quiet = true;
            }
        </script>
        
        <!-- Third-Party CDNs -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        
        <!-- Tailwind Theme Configurations -->
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            brandBg: "#131314",
                            containerBg: "#1e1f20",
                            inputBg: "#282a2c",
                            userMsgBg: "#2a2b2d",
                            textMain: "#e3e3e3",
                            textSub: "#9ca3af",
                        },
                        backgroundImage: {
                            "accent-gradient": "linear-gradient(135deg, #6366f1, #d946ef, #38bdf8)",
                            "header-text": "linear-gradient(45deg, #a8c7fa, #d3e3fd)",
                        },
                    },
                },
            };
        </script>
        
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="bg-brandBg text-textMain h-dynamic-screen m-0 flex justify-center items-center font-sans antialiased overflow-hidden">
        <div id="app" class="w-full h-dynamic-screen md:md-h-dynamic-card md:max-w-2xl lg:max-w-3xl md:bg-containerBg md:rounded-[24px] shadow-2xl flex flex-col overflow-hidden md:border md:border-[#2f3032] bg-containerBg">
            
            <!-- Mount Components Dynamically via Template Layouts -->
            <chat-header @new-chat="startNewChat"></chat-header>
            
            <chat-box :messages="messages" :is-farsi="isFarsi" ref="chatBoxRef"></chat-box>
            
            <input-area 
                v-model:userInput="userInput"
                v-model:useWebSearch="useWebSearch"
                v-model:attachedImageBase64="attachedImageBase64"
                :is-loading="isLoading"
                :is-farsi="isFarsi"
                @send="sendMessage"
            ></input-area>

        </div>

        <!-- Main Application Entry Module -->
        <script type="module" src="js/app.js"></script>
    </body>
</html>
