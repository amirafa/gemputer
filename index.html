<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GemPuter</title>
    <!-- Puter.js SDK -->
    <script src="https://js.puter.com/v2/"></script>
    <script>
        if (typeof puter !== 'undefined') {
            puter.quiet = true;
        }
    </script>
    <!-- Vue 3 Global Build CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Marked.js CDN (Markdown Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBg: '#131314',
                        containerBg: '#1e1f20',
                        inputBg: '#282a2c',
                        userMsgBg: '#2a2b2d',
                        textMain: '#e3e3e3',
                        textSub: '#9ca3af',
                    },
                    backgroundImage: {
                        // Refreshed premium cyber-metallic gradient for the badge
                        'accent-gradient': 'linear-gradient(135deg, #6366f1, #d946ef, #38bdf8)',
                        'header-text': 'linear-gradient(45deg, #a8c7fa, #d3e3fd)',
                    }
                }
            }
        }
    </script>
    <style>
        .h-dynamic-screen {
            height: 100vh;
            height: 100dvh;
        }
        @media (min-width: 768px) {
            .md-h-dynamic-card {
                height: 85vh;
                height: 85dvh;
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #37393b;
            border-radius: 9999px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Markdown Styling Overrides */
        .prose-markdown p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose-markdown p:last-child { margin-bottom: 0; }
        .prose-markdown strong { color: #ffffff; font-weight: 700; }
        .prose-markdown em { font-style: italic; color: #cbd5e1; }
        
        .prose-markdown ul { list-style-type: disc; margin-bottom: 0.75rem; }
        .prose-markdown ol { list-style-type: decimal; margin-bottom: 0.75rem; }
        .prose-markdown li { margin-bottom: 0.25rem; }
        
        .prose-markdown.ltr-msg ul, .prose-markdown.ltr-msg ol { margin-left: 1.5rem; margin-right: 0; text-align: left; }
        .prose-markdown.rtl-msg ul, .prose-markdown.rtl-msg ol { margin-right: 1.5rem; margin-left: 0; text-align: right; }
        
        .prose-markdown code { background-color: #282a2c; padding: 0.2rem 0.4rem; border-radius: 0.375rem; font-family: monospace; font-size: 0.875em; color: #f43f5e; }
        .prose-markdown pre { background-color: #282a2c; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; border: 1px solid #3c3d3f; }
        .prose-markdown pre code { background-color: transparent; padding: 0; border: none; color: #e3e3e3; font-size: 0.9em; }
    </style>
</head>
<body class="bg-brandBg text-textMain h-dynamic-screen m-0 flex justify-center items-center font-sans antialiased overflow-hidden">

    <div id="app" class="w-full h-dynamic-screen md:md-h-dynamic-card md:max-w-2xl lg:max-w-3xl md:bg-containerBg md:rounded-[24px] shadow-2xl flex flex-col overflow-hidden md:border md:border-[#2f3032] bg-containerBg">
        
        <!-- Header with embedded New Chat Trigger Button -->
        <div class="chat-header px-4 py-4 md:px-6 md:py-5 border-b border-[#2f3032] flex items-center justify-between shrink-0 select-none">
            <div class="flex items-center gap-2">
                <span class="bg-header-text bg-clip-text text-transparent text-xl md:text-2xl font-semibold tracking-tight">GemPuter</span>
                <!-- Updated model tag value and gradient layout -->
                <span class="text-[8px] font-black px-2 py-0.5 rounded bg-accent-gradient text-white tracking-widest align-middle uppercase shadow-sm">GPT-5.4 NANO</span>
            </div>
            
            <!-- Clear History Action Link / Button -->
            <button 
                @click="startNewChat" 
                title="Start a fresh chat history context" 
                class="flex items-center gap-1.5 text-xs font-medium text-[#a8c7fa] hover:text-white px-3 py-1.5 rounded-full hover:bg-[#282a2c] active:scale-95 transition-all duration-150"
            >
                <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                <span>New Chat</span>
            </button>
        </div>

        <!-- Messages Area -->
        <div ref="chatBox" class="messages custom-scrollbar flex-1 p-4 md:p-6 overflow-y-auto flex flex-col gap-5 md:gap-6">
            <template v-for="(msg, index) in messages" :key="index">
                <!-- System / AI Message -->
                <div v-if="msg.role === 'assistant' || msg.role === 'system'" 
                     class="message max-w-[88%] md:max-w-[85%] leading-relaxed text-sm md:text-base px-2 self-start animate-fade-in prose-markdown"
                     :dir="isFarsi(msg.content) ? 'rtl' : 'ltr'"
                     :class="[
                        msg.isThinking ? 'text-textSub italic font-normal' : '',
                        isFarsi(msg.content) ? 'text-right rtl rtl-msg w-full' : 'text-left ltr ltr-msg'
                     ]"
                     v-html="renderMarkdown(msg.content)">
                </div>

                <!-- Error Message Style -->
                <div v-else-if="msg.role === 'error'"
                     class="message bg-[#3a2512] text-[#fcb97d] self-center text-xs md:text-sm px-4 py-2 rounded-lg border border-[#5c3818] animate-fade-in">
                     {{ msg.content }}
                </div>

                <!-- User Message -->
                <div v-else-if="msg.role === 'user'" 
                     class="message max-w-[88%] md:max-w-[85%] leading-relaxed text-sm md:text-base animate-fade-in bg-userMsgBg text-textMain align-self-end self-end px-4 py-2.5 md:px-5 md:py-3 rounded-[18px] border border-[#3c3d3f]"
                     :dir="isFarsi(msg.content) ? 'rtl' : 'ltr'"
                     :class="isFarsi(msg.content) ? 'text-right rtl' : 'text-left ltr'">
                    {{ msg.content }}
                </div>
            </template>
        </div>

        <!-- Input Area -->
        <div class="input-area-wrapper px-4 pb-4 md:px-6 md:pb-6 bg-containerBg shrink-0">
            <div class="input-area flex items-center bg-inputBg border border-transparent rounded-[28px] md:rounded-[32px] pl-4 pr-2 py-1 focus-within:border-[#4285f4] focus-within:ring-1 focus-within:ring-[#4285f4] transition-all duration-200">
                <input 
                    type="text" 
                    v-model="userInput" 
                    @keypress.enter="sendMessage" 
                    :disabled="isLoading"
                    ref="inputField"
                    placeholder="Ask GemPuter..." 
                    autocomplete="off" 
                    :dir="isFarsi(userInput) ? 'rtl' : 'ltr'"
                    :class="isFarsi(userInput) ? 'text-right rtl' : 'text-left ltr'"
                    class="flex-1 bg-transparent border-none text-textMain outline-none text-sm md:text-base py-3 placeholder-textSub"
                >
                <button 
                    @click="sendMessage" 
                    :disabled="isLoading || !userInput.trim()" 
                    title="Send message" 
                    class="bg-transparent text-[#a8c7fa] p-2.5 md:p-3 rounded-full flex justify-center items-center hover:bg-[#353739] active:scale-95 md:hover:text-white disabled:text-[#4e5154] disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:active:scale-100 transition-all duration-150"
                >
                    <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current transform rotate-45" :class="isFarsi(userInput) ? 'scale-x-[-1]' : ''">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

<script>
    if (typeof marked !== 'undefined') {
        marked.use({ async: false, breaks: true });
    }

    const { createApp, ref, nextTick } = Vue;

    createApp({
        setup() {
            const userInput = ref('');
            const isLoading = ref(false);
            const chatBox = ref(null);
            const inputField = ref(null);
            
            const getInitialGreetingMessage = () => [
                {
                    role: 'assistant',
                    content: 'Hello! I am **GemPuter**, your assistant with continuous context memory. How can I help you today?',
                    isThinking: false
                }
            ];

            const messages = ref(getInitialGreetingMessage());

            const isFarsi = (text) => {
                if (!text) return false;
                const farsiPattern = /[\u0600-\u06FF]/;
                return farsiPattern.test(text);
            };

            const scrollToBottom = async () => {
                await nextTick();
                if (chatBox.value) {
                    chatBox.value.scrollTop = chatBox.value.scrollHeight;
                }
            };

            const startNewChat = () => {
                messages.value = getInitialGreetingMessage();
                userInput.value = '';
                isLoading.value = false;
                nextTick(() => inputField.value?.focus());
            };

            const renderMarkdown = (text) => {
                if (!text || typeof text !== 'string') return '';
                try {
                    return marked.parse(text);
                } catch (e) {
                    console.error("Markdown rendering error:", e);
                    return text;
                }
            };

            const sendMessage = async () => {
                const text = userInput.value.trim();
                if (!text || isLoading.value) return;

                messages.value.push({ role: 'user', content: text });
                userInput.value = '';
                isLoading.value = true;
                await scrollToBottom();

                messages.value.push({ 
                    role: 'assistant', 
                    content: 'Thinking...', 
                    isThinking: true 
                });
                const aiMessageIndex = messages.value.length - 1;
                await scrollToBottom();

                try {
                    const apiHistoryPayload = messages.value
                        .filter(m => !m.isThinking && m.role !== 'error')
                        .map(m => ({
                            role: m.role === 'assistant' ? 'assistant' : 'user',
                            content: m.content
                        }));

                    let response;
                    try {
                        response = await puter.ai.chat(apiHistoryPayload, { model: 'gpt-5.4-nano' });
                    } catch (modelError) {
                        response = await puter.ai.chat(apiHistoryPayload);
                    }

                    let parsedContentText = '';
                    if (response && typeof response === 'object') {
                        if (response.message && response.message.content) {
                            parsedContentText = response.message.content;
                        } else if (response.text) {
                            parsedContentText = response.text;
                        } else {
                            parsedContentText = String(response);
                        }
                    } else {
                        parsedContentText = response || '';
                    }

                    messages.value[aiMessageIndex].content = parsedContentText;
                    messages.value[aiMessageIndex].isThinking = false;

                } catch (error) {
                    console.error("Puter Engine Error:", error);
                    messages.value.splice(aiMessageIndex, 1);
                    messages.value.push({
                        role: 'error',
                        content: 'Error: Failed to fetch response from GemPuter engine.'
                    });
                } finally {
                    isLoading.value = false;
                    await scrollToBottom();
                    nextTick(() => inputField.value?.focus());
                }
            };

            return {
                userInput,
                isLoading,
                messages,
                chatBox,
                inputField,
                sendMessage,
                renderMarkdown,
                isFarsi,
                startNewChat
            };
        }
    }).mount('#app');
</script>

</body>
</html>
