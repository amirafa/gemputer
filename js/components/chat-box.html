<div
    class="messages custom-scrollbar flex-1 p-4 md:p-6 overflow-y-auto flex flex-col gap-5 md:gap-6"
>
    <template v-for="(msg, index) in messages" :key="index">
        <div
            v-if="msg.role === 'assistant' || msg.role === 'system'"
            class="message max-w-[88%] md:max-w-[85%] leading-relaxed text-sm md:text-base px-2 self-start animate-fade-in prose-markdown"
            :dir="isFarsi(msg.content) ? 'rtl' : 'ltr'"
            :class="[msg.isThinking ? 'text-textSub italic font-normal' : '', isFarsi(msg.content) ? 'text-right rtl rtl-msg w-full' : 'text-left ltr ltr-msg']"
            v-html="renderMarkdown(msg.content)"
        ></div>

        <div
            v-else-if="msg.role === 'error'"
            class="message bg-[#3a2512] text-[#fcb97d] self-center text-xs md:text-sm px-4 py-2 rounded-lg border border-[#5c3818] animate-fade-in"
        >
            {{ msg.content }}
        </div>

        <div
            v-else-if="msg.role === 'user'"
            class="message max-w-[88%] md:max-w-[85%] flex flex-col gap-2 leading-relaxed text-sm md:text-base animate-fade-in bg-userMsgBg text-textMain align-self-end self-end px-4 py-2.5 md:px-5 md:py-3 rounded-[18px] border border-[#3c3d3f]"
            :dir="isFarsi(msg.content || msg.textSummary) ? 'rtl' : 'ltr'"
            :class="isFarsi(msg.content || msg.textSummary) ? 'text-right rtl' : 'text-left ltr'"
        >
            <img
                v-if="msg.attachedImage"
                :src="msg.attachedImage"
                class="max-w-xs max-h-48 rounded-lg object-cover mb-1 border border-[#4e5154]"
            />
            <span v-if="msg.textSummary">{{ msg.textSummary }}</span>
        </div>
    </template>
</div>
