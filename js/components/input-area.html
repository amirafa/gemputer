<div
    class="input-area-wrapper px-4 pb-4 md:px-6 md:pb-6 bg-containerBg shrink-0 flex flex-col gap-2"
>
    <div class="flex items-center gap-3">
        <div
            v-if="attachedImageBase64"
            class="flex items-center gap-2 bg-inputBg p-2 rounded-xl border border-[#3c3d3f] animate-fade-in w-fit max-w-[50%]"
        >
            <div class="relative">
                <img
                    :src="attachedImageBase64"
                    class="w-10 h-10 rounded-lg object-cover border border-[#4e5154]"
                />
                <button
                    @click="clearSelectedImage"
                    class="absolute -top-1.5 -right-1.5 bg-red-500 hover:bg-red-600 text-white rounded-full p-0.5 shadow-md"
                >
                    <svg viewBox="0 0 24 24" class="w-3 h-3 fill-current">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                        />
                    </svg>
                </button>
            </div>
        </div>
        <label
            class="flex items-center gap-2 text-xs text-textSub cursor-pointer hover:text-white transition-colors"
        >
            <input
                type="checkbox"
                :checked="useWebSearch"
                @change="$emit('update:useWebSearch', $event.target.checked)"
                class="accent-indigo-500"
            />
            <span>Web Search</span>
        </label>
    </div>

    <div
        class="input-area flex items-center bg-inputBg border border-transparent rounded-[28px] md:rounded-[32px] pl-2 pr-2 py-1 focus-within:border-[#4285f4] focus-within:ring-1 focus-within:ring-[#4285f4] transition-all duration-200"
    >
        <input
            type="file"
            ref="imageFileInput"
            @change="handleImageSelection"
            accept="image/*"
            class="hidden"
        />
        <button
            @click="imageFileInput.click()"
            :disabled="isLoading"
            title="Upload an image"
            class="text-[#a8c7fa] p-2.5 md:p-3 rounded-full hover:bg-[#353739] active:scale-95 disabled:text-[#4e5154] transition-all duration-150 shrink-0"
        >
            <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current">
                <path
                    d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0-2-.9-2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
                />
            </svg>
        </button>
        <input
            type="text"
            :value="userInput"
            @input="$emit('update:userInput', $event.target.value)"
            @keypress.enter="$emit('send')"
            :disabled="isLoading"
            ref="inputField"
            placeholder="Ask GemPuter..."
            autocomplete="off"
            :dir="isFarsi(userInput) ? 'rtl' : 'ltr'"
            :class="isFarsi(userInput) ? 'text-right rtl' : 'text-left ltr'"
            class="flex-1 bg-transparent border-none text-textMain outline-none text-sm md:text-base py-3 px-2 placeholder-textSub"
        />
        <div class="p-2.5 md:p-3 flex justify-center items-center shrink-0">
            <svg
                v-if="isLoading"
                class="animate-spin w-5 h-5 text-[#4285f4]"
                viewBox="0 0 24 24"
            >
                <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                    fill="none"
                ></circle>
                <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                ></path>
            </svg>
            <button
                v-else
                @click="$emit('send')"
                :disabled="isLoading || (!userInput.trim() && !attachedImageBase64)"
                title="Send message"
                class="text-[#a8c7fa] rounded-full hover:bg-[#353739] active:scale-95 transition-all duration-150"
            >
                <svg
                    viewBox="0 0 24 24"
                    class="w-5 h-5 fill-current transform rotate-45"
                    :class="isFarsi(userInput) ? 'scale-x-[-1]' : ''"
                >
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
                </svg>
            </button>
        </div>
    </div>
</div>
